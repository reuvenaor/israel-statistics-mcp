name: Version PR

# ZERO configured secrets by design (uses only the automatic GITHUB_TOKEN).
# This workflow ONLY maintains the changesets "Version Packages" PR
# (version bump + CHANGELOG). Publishing is done locally by the maintainer
# with web-authenticated accounts:
#
#   1. Merge the Version Packages PR, then `git pull` on main
#   2. `pnpm release`            -> builds + publishes to npm (npm login/web auth)
#      `git push --follow-tags`
#   3. `docker buildx build --platform linux/amd64,linux/arm64 \
#         -t reuvenaor/israel-statistics-mcp:<version> \
#         -t reuvenaor/israel-statistics-mcp:latest --push .`
#      (Docker Desktop web-authenticated)
#   4. After npm + Docker exist: `mcp-publisher login github && mcp-publisher publish`
#      (server.json version is maintained in-repo — see the release checklist)
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version-pr:
    name: Maintain Version Packages PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Open or update the Version Packages PR
        uses: changesets/action@3841a0683d3cfa6dae0f9bb335290003010fe3f0 # v1.9.0
        with:
          version: pnpm run version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
