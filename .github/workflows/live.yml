name: Live CBS

# Nightly non-blocking verification against the real CBS API.
# Failures open a labelled issue instead of blocking merges — CBS outages
# and payload drift should be triaged, not block development.
on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: live-cbs
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:live
      - run: node scripts/smoke.mjs --live
      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          title="Nightly live CBS suite failed ($(date -u +%F))"
          body=$(cat <<EOF
          The live CBS verification failed. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Triage:
          - ALL tools failing with timeouts/5xx = CBS outage. Close this.
          - A single tool/schema failure = CBS changed a payload shape. Capture the new payload as a fixture and adjust the response schema.
          - Every CBS tool passing but a smoke check failing = harness drift, not CBS. Check whether the pinned MCP Inspector version in scripts/smoke.mjs needs a bump.
          EOF
          )
          # No `|| gh issue create` fallback: if the live-cbs-failure label is
          # missing, this step must fail loudly. The old fallback created an
          # UNLABELLED issue, which the dedupe query below could never find —
          # that filed a fresh duplicate every night (issues #10-#17).
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label live-cbs-failure --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" --label live-cbs-failure
          fi
